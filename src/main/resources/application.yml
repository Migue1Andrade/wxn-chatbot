server:
  port: ${BACKEND_PORT:4001}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: wxn-chatbot
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:4003}/${POSTGRES_DB}}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:${MONGO_PORT:4004}/${MONGO_DB}}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}

wxn:
  autoguia:
    rag:
      enabled: ${AUTOGUIA_RAG_ENABLED:false}
    embedding:
      enabled: ${AUTOGUIA_EMBEDDING_ENABLED:false}
      provider: ${AUTOGUIA_EMBEDDING_PROVIDER:}
      model: ${AUTOGUIA_EMBEDDING_MODEL:}
      dimension: ${AUTOGUIA_EMBEDDING_DIMENSION:0}
      endpoint: ${AUTOGUIA_EMBEDDING_ENDPOINT:}
      api-key: ${AUTOGUIA_EMBEDDING_API_KEY:}
      connect-timeout: ${AUTOGUIA_EMBEDDING_CONNECT_TIMEOUT:PT3S}
      timeout: ${AUTOGUIA_EMBEDDING_TIMEOUT:PT15S}
    indexing:
      enabled: ${AUTOGUIA_INDEXING_ENABLED:false}
      delay: ${AUTOGUIA_INDEXING_DELAY:PT5S}
      lease: ${AUTOGUIA_INDEXING_LEASE:PT180S}
    retrieval:
      minimum-similarity: ${AUTOGUIA_RETRIEVAL_MINIMUM_SIMILARITY:0.25}
    generation:
      enabled: ${AUTOGUIA_GENERATION_ENABLED:false}
      endpoint: ${AUTOGUIA_GENERATION_ENDPOINT:}
      model: ${AUTOGUIA_GENERATION_MODEL:}
      api-key: ${AUTOGUIA_GENERATION_API_KEY:}
      connect-timeout: ${AUTOGUIA_GENERATION_CONNECT_TIMEOUT:PT3S}
      timeout: ${AUTOGUIA_GENERATION_TIMEOUT:PT45S}
  auth:
    password-reset:
      public-url: ${PASSWORD_RESET_PUBLIC_URL:http://localhost:4002/#!/reset-password}
      from: ${PASSWORD_RESET_FROM:no-reply@wxn.local}
  dev:
    api-key: ${DEV_API_KEY:}
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:4002}

openbot:
  support:
    enabled: ${OPENBOT_SUPPORT_ENABLED:false}
    webhook-url: ${OPENBOT_SUPPORT_WEBHOOK_URL:}
    service-token: ${OPENBOT_SUPPORT_SERVICE_TOKEN:}
    hmac-secret: ${OPENBOT_SUPPORT_HMAC_SECRET:}
    auto-assign-bot-id: ${OPENBOT_SUPPORT_AUTO_ASSIGN_BOT_ID:}
    auto-assign-channel-id: ${OPENBOT_SUPPORT_AUTO_ASSIGN_CHANNEL_ID:}
# Provider URLs contain credentials. Never enable HTTP request tracing for these clients.
logging:
  level:
    org.springframework.web.client: 'OFF'
    jdk.internal.net.http: 'OFF'
