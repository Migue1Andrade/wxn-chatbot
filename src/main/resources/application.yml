server:
  port: ${BACKEND_PORT:4001}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: wxn-chatbot
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:4003}/${POSTGRES_DB}}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:${MONGO_PORT:4004}/${MONGO_DB}}

wxn:
  dev:
    api-key: ${DEV_API_KEY:}
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:4002}
# Provider URLs contain credentials. Never enable HTTP request tracing for these clients.
logging:
  level:
    org.springframework.web.client: 'OFF'
    jdk.internal.net.http: 'OFF'
