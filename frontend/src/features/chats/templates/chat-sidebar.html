<header class="inbox-header">
  <div class="inbox-heading">
    <div>
      <h1>Conversas</h1>
      <p>Caixa de entrada do WhatsApp</p>
    </div>
    <button
      ng-if="$ctrl.isAdmin && $ctrl.state.scope === 'all'"
      type="button"
      class="filter-toggle"
      ng-class="{'is-active': $ctrl.filtersOpen}"
      ng-click="$ctrl.filtersOpen = !$ctrl.filtersOpen"
      aria-label="Filtrar por responsável"
      aria-expanded="{{$ctrl.filtersOpen || false}}"
      aria-controls="inbox-filters"
      title="Filtrar por responsável"
    >
      <svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10m-7 6h4" /></svg>
    </button>
  </div>
  <label class="inbox-search">
    <svg viewBox="0 0 24 24">
      <circle
        cx="10.5"
        cy="10.5"
        r="6.5"
      />
      <path d="m16 16 4 4" />
    </svg>
    <input
      type="search"
      ng-model="$ctrl.query"
      ng-change="$ctrl.onSearch()"
      maxlength="100"
      placeholder="Buscar por nome, telefone ou ID"
      aria-label="Buscar conversa"
    />
  </label>
  <div
    class="inbox-selects"
    ng-class="{'has-scope': $ctrl.isAdmin}"
  >
    <label ng-if="$ctrl.isAdmin">
      <span>Conversas</span>
      <select
        ng-model="$ctrl.scopeFilter"
        ng-model-options="{getterSetter: true}"
      >
        <option value="all">Todas as conversas</option>
        <option value="mine">Minhas conversas</option>
      </select>
    </label>
    <label>
      <span>Status</span>
      <select
        ng-model="$ctrl.statusFilter"
        ng-model-options="{getterSetter: true}"
        ng-options="filter.value as filter.label for filter in $ctrl.availableFilters()"
      ></select>
    </label>
  </div>
</header>
<section
  id="inbox-filters"
  ng-if="$ctrl.filtersOpen && $ctrl.isAdmin && $ctrl.state.scope === 'all'"
  class="inbox-filters space-y-4 border-b border-slate-100 px-6 py-4"
  aria-label="Filtros de atendimento"
>
  <label class="block text-xs font-medium text-slate-600">
    Responsável pela conversa
    <select
      aria-label="Filtrar por responsável"
      ng-model="$ctrl.state.responsibleId"
      ng-disabled="$ctrl.state.filter === 'mine' || $ctrl.state.filter === 'unassigned'"
      ng-options="member.id as member.name + ' · ' + member.type for member in $ctrl.member.members"
      ng-change="$ctrl.onResponsible()"
      class="mt-1.5 w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-xs outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-100 disabled:bg-slate-50 disabled:text-slate-400"
    >
      <option value="">Todos os responsáveis</option>
    </select>
  </label>
</section>
<div
  ng-if="$ctrl.state.error"
  class="m-4 rounded-xl bg-red-50 p-4 text-sm text-red-700"
  role="alert"
>
  {{$ctrl.state.error}}
  <button
    class="mt-2 block font-semibold underline"
    ng-click="$ctrl.onRetry()"
  >
    Tentar novamente
  </button>
</div>
<loading-state
  ng-if="$ctrl.state.loading"
  label="Carregando conversas"
></loading-state>
<chat-list
  class="min-h-0 flex-1 overflow-y-auto"
  items="$ctrl.state.conversations"
  query="$ctrl.query"
  selected-id="$ctrl.state.selected.id"
  loading="$ctrl.state.loading"
  error="$ctrl.state.error"
  unread="$ctrl.state.unread"
  on-select="$ctrl.onSelect({conversation: conversation})"
  member-name="$ctrl.memberName(id)"
  show-active-owner="$ctrl.isAdmin"
></chat-list>
<button
  ng-if="$ctrl.state.hasMore"
  type="button"
  ng-disabled="$ctrl.state.loadingMore || $ctrl.state.loading"
  ng-click="$ctrl.onMore()"
  class="mx-6 mb-3 rounded-lg border border-slate-200 px-3 py-2 text-xs text-teal-700 disabled:opacity-40"
>
  {{$ctrl.state.loadingMore ? 'Carregando…' : 'Carregar mais conversas'}}
</button>
<div
  ng-if="$ctrl.socket.error"
  role="status"
  class="mx-6 mb-3 rounded-lg bg-amber-50 p-3 text-xs text-amber-700"
>
  {{$ctrl.socket.error}}
  <button
    ng-if="!$ctrl.socket.connecting"
    type="button"
    ng-click="$ctrl.onReconnect()"
    class="ml-2 underline"
  >
    Reconectar
  </button>
</div>
<div
  ng-if="$ctrl.contextError"
  role="alert"
  class="mx-6 mb-3 rounded-lg bg-amber-50 p-3 text-xs text-amber-700"
>
  {{$ctrl.contextError}}
  <button
    type="button"
    ng-click="$ctrl.onRetry()"
    class="ml-2 underline"
  >
    Atualizar
  </button>
</div>
<footer class="inbox-footer">
  <span
    class="connection-state"
    role="status"
  >
    <i ng-class="{'is-connected': $ctrl.socket.connected}"></i>
    {{$ctrl.socket.connected ? 'Conectado' : ($ctrl.socket.connecting ? 'Reconectando…' : 'Desconectado')}}
  </span>
  <span
    class="inbox-agent"
    title="{{$ctrl.member.member.name}}"
  >
    {{$ctrl.member.member.name || 'Conta sem atendente vinculado'}}
  </span>
</footer>
