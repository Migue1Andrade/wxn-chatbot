<div class="flex h-dvh min-h-0 bg-slate-50 text-slate-800" ng-class="{'chat-open': vm.mobileOpen}">
  <chat-sidebar
    class="chat-sidebar flex min-h-0 w-full shrink-0 flex-col border-r border-slate-200 bg-white md:w-[360px] lg:w-[390px]"
    state="vm.state"
    socket="vm.socket"
    member="vm.member"
    query="vm.query"
    on-select="vm.select(conversation)"
    on-retry="vm.refresh()"
    on-filter="vm.changeFilter(filter)"
    on-reader="vm.changeReader(id)"
    on-responsible="vm.changeResponsible()"
    filters="vm.filters"
    on-search="vm.search()"
    on-more="vm.loadMore()"
    context-error="vm.contextError"
    on-reconnect="vm.reconnect()"
  ></chat-sidebar>
  <main class="chat-main flex min-w-0 flex-1 flex-col" aria-label="Conversa">
    <div
      ng-if="!vm.state.selected"
      class="flex h-full flex-col items-center justify-center gap-5 px-8 text-center"
    >
      <div class="flex h-20 w-20 items-center justify-center rounded-3xl bg-teal-100 text-teal-700">
        <svg
          width="36"
          height="36"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          aria-hidden="true"
        >
          <path
            d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"
          />
        </svg>
      </div>
      <div>
        <h1 class="text-2xl font-semibold tracking-tight">Seu atendimento começa aqui</h1>
        <p class="mt-3 max-w-sm text-sm leading-6 text-slate-500">
          Selecione uma conversa para acompanhar o histórico e responder aos seus contatos.
        </p>
      </div>
      <span class="mt-4 rounded-full border border-slate-200 px-4 py-2 text-xs text-slate-500">
        Conversas sincronizadas em tempo real
      </span>
    </div>
    <section
      ng-if="vm.state.selected"
      ng-controller="MessagesController as messages"
      class="flex min-h-0 flex-1 flex-col"
    >
      <chat-header
        members="vm.member.members"
        channels="vm.channels"
        actor="vm.member.member"
        conversation="vm.state.selected"
        channel-name="{{vm.channelName(vm.state.selected.channelId)}}"
        on-back="vm.back()"
      ></chat-header>
      <message-list
        class="relative flex min-h-0 flex-1 flex-col"
        messages="messages.state.items"
        loading="messages.history.loading"
        error="messages.error()"
        conversation-id="vm.state.selected.id"
        member-name="messages.memberName(id)"
        events="messages.state.events"
        has-more="messages.state.hasMore"
        older-loading="messages.history.olderQuery.loading"
        on-load-older="messages.loadOlder()"
        on-retry="messages.reload()"
      ></message-list>
      <message-composer
        conversation-id="vm.state.selected.id"
        sending="messages.operation().loading"
        blocked="!messages.member.member || !vm.channelActive(vm.state.selected.channelId) || vm.state.selected.status === 'CLOSED'"
        reason="{{messages.member.error || (vm.state.selected.status === 'CLOSED' ? 'Reabra o atendimento para responder.' : '') || (!vm.channelActive(vm.state.selected.channelId) ? 'O canal está indisponível ou inativo.' : '')}}"
        member-name="{{messages.member.member.name}}"
      ></message-composer>
    </section>
  </main>
</div>
