<button
  type="button"
  ng-click="$ctrl.onSelect({conversation: $ctrl.conversation})"
  class="conversation-row"
  ng-class="{'is-selected': $ctrl.selected}"
  aria-pressed="{{$ctrl.selected}}"
  data-conversation-id="{{$ctrl.conversation.id}}"
>
  <span
    class="contact-avatar"
    ng-class="'avatar-' + $ctrl.tone($ctrl.conversation.displayName || $ctrl.conversation.contactPhone)"
  >
    {{$ctrl.initials($ctrl.conversation.displayName || $ctrl.conversation.contactPhone)}}
  </span>
  <span class="conversation-summary">
    <span class="conversation-title">
      <strong>
        {{$ctrl.conversation.displayName || $ctrl.conversation.contactPhone || 'Conversa antiga'}}
      </strong>
      <time>{{$ctrl.conversation.updatedAt | date:'HH:mm'}}</time>
    </span>
    <span class="conversation-preview">
      {{$ctrl.conversation.lastMessagePreview || 'Ver histórico da conversa'}}
    </span>
    <span class="conversation-meta">
      <span
        class="status-tag"
        ng-class="{'status-waiting': $ctrl.conversation.status === 'PENDING', 'status-active': $ctrl.visibleStatus($ctrl.conversation.status) === 'IN_PROGRESS', 'status-closed': $ctrl.isFinal($ctrl.conversation.status)}"
      >
        {{$ctrl.statusLabel($ctrl.conversation.status)}}
      </span>
      <span
        ng-if="!($ctrl.showActiveOwner && $ctrl.visibleStatus($ctrl.conversation.status) === 'IN_PROGRESS')"
        class="conversation-owner"
      >
        {{$ctrl.memberName}}
      </span>
      <span
        ng-if="$ctrl.unread"
        class="unread-badge"
        aria-label="{{$ctrl.unread}} mensagens não lidas"
      >
        {{$ctrl.unread}}
      </span>
    </span>
    <span
      ng-if="$ctrl.waitingForReply($ctrl.conversation)"
      class="conversation-reply-state"
    >
      {{$ctrl.waitingForReply($ctrl.conversation)}}
    </span>
    <span
      ng-if="$ctrl.showActiveOwner && $ctrl.visibleStatus($ctrl.conversation.status) === 'IN_PROGRESS'"
      class="conversation-active-owner"
      title="{{$ctrl.memberName}}"
    >
      <span ng-if="$ctrl.conversation.assignedMemberId != null">Atendido por</span>
      <strong>{{$ctrl.memberName}}</strong>
    </span>
  </span>
</button>
