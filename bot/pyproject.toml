[project]
name = "wxn-bot"
version = "0.1.0"
description = "Serviço de IA do bot de atendimento do WXN Chatbot"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.12.0",
    "fastapi>=0.165.0",
    "fastembed>=0.9.1",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
